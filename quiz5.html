function toArabicDigits(n){
  const map = ["٠","١","٢","٣","٤","٥","٦","٧","٨","٩"];
  return String(n).replace(/[0-9]/g, d => map[d]);
}

function formatTime(sec){
  const m = Math.floor(sec/60);
  const s = sec%60;
  return `${toArabicDigits(String(m).padStart(2,"0"))}:${toArabicDigits(String(s).padStart(2,"0"))}`;
}

  );

function matchParen(s, prefix, needSep){
  // مطابقة الأوامر ذات الأقواس (\\F / \\R / \\P) مع دعم تداخل الأقواس
  const tag = "\\" + prefix + "(";
  let at = s.indexOf(tag);
  while (at !== -1){
    const open = at + tag.length - 1;
    let depth = 0, sep = -1;
    for (let j = open; j < s.length; j++){
      const ch = s[j];
      if (ch === "(") depth++;
      else if (ch === ")"){
        depth--;
        if (depth === 0){
          if (!needSep || sep !== -1){
            return { index: at, 0: s.slice(at, j + 1), 1: needSep ? s.slice(open + 1, sep) : s.slice(open + 1, j), 2: needSep ? s.slice(sep + 2, j) : "" };
          }
          break;
        }
      }
      else if (needSep && ch === ";" && s[j+1] === ";" && depth === 1 && sep === -1){ sep = j; }
    }
    at = s.indexOf(tag, at + 1);
  }
  return null;
}

function Power({ base, exp }){
  return (
    <span dir="rtl" className="inline-flex items-start align-middle mx-[1px]" style={{verticalAlign:"middle"}}>
      <span className="leading-normal">{base}</span>
      <span className="font-bold leading-none" style={{fontSize:"0.66em", marginTop:"0.1em"}}>{exp}</span>
    </span>
  );
}

function renderInlineMath(text, keyPrefix){
  if (typeof text !== "string") return text;
  const smallRe = /\\f\{([^{}]*?)\|\|([^{}]*?)\}/;
  // ملاحظة: مطابقة الأوامر ذات الأقواس (F/R/P) تتم عبر matchParen (تدعم التداخل)

  const nodes = [];
  let remaining = text;
  let key = 0;

  while (remaining.length){
    const bigMatch = matchParen(remaining, "F", true);
    const smallMatch = smallRe.exec(remaining);
    const rootMatch = matchParen(remaining, "R", false);
    const powMatch = matchParen(remaining, "P", true);

    let match = null;
    let type = "";
    let minIndex = remaining.length;

    if (bigMatch && bigMatch.index < minIndex) { match = bigMatch; type = "F"; minIndex = bigMatch.index; }
    if (smallMatch && smallMatch.index < minIndex) { match = smallMatch; type = "f"; minIndex = smallMatch.index; }
    if (rootMatch && rootMatch.index < minIndex) { match = rootMatch; type = "R"; minIndex = rootMatch.index; }
    if (powMatch && powMatch.index < minIndex) { match = powMatch; type = "P"; minIndex = powMatch.index; }

    if (!match){
      nodes.push(<React.Fragment key={keyPrefix + "-" + key++}>{remaining}</React.Fragment>);
      break;
    }
    if (match.index > 0){
      nodes.push(<React.Fragment key={keyPrefix + "-" + key++}>{remaining.slice(0, match.index)}</React.Fragment>);
    }

    if (type === "F"){
      nodes.push(
        <BigFraction
          key={keyPrefix + "-" + key++}
          num={renderInlineMath(match[1], keyPrefix + "-bn" + key)}
          den={renderInlineMath(match[2], keyPrefix + "-bd" + key)}
        />
      );
    } else if (type === "f"){
      // تم التحديث هنا عشان الكسر يقدر يقبل جذر جواه
      nodes.push(<Fraction key={keyPrefix + "-" + key++} num={renderInlineMath(match[1], keyPrefix + "-fn" + key)} den={renderInlineMath(match[2], keyPrefix + "-fd" + key)} />);
    } else if (type === "R"){
      nodes.push(
        <ArabicRoot key={keyPrefix + "-" + key++}>
          {renderInlineMath(match[1], keyPrefix + "-r" + key)}
        </ArabicRoot>
      );
    } else if (type === "P"){
      nodes.push(
        <Power
          key={keyPrefix + "-" + key++}
          base={renderInlineMath(match[1], keyPrefix + "-pb" + key)}
          exp={renderInlineMath(match[2], keyPrefix + "-pe" + key)}
        />
      );
    }
    remaining = remaining.slice(match.index + match[0].length);
  }
  return nodes;
}

function renderMathText(text){
  if (typeof text !== "string") return text;
  const parts = text.split("`");
  return parts.map((part, i) => {
    // دعم الأقواس الكبيرة جداً \Big والأقواس المتوسطة \big
    const subParts = part.split(/(\\big\(|\\big\)|\\Big\(|\\Big\))/g);
    
    const renderedSubParts = subParts.map((sub, j) => {
      if (sub === '\\big(') return <span key={"bl"+j} className="text-3xl inline-block align-middle mx-0.5 font-normal" style={{ transform: "translateY(-1px)" }}>(</span>;
      if (sub === '\\big)') return <span key={"br"+j} className="text-3xl inline-block align-middle mx-0.5 font-normal" style={{ transform: "translateY(-1px)" }}>)</span>;
      if (sub === '\\Big(') return <span key={"Bbl"+j} className="text-5xl inline-block align-middle mx-1 font-normal" style={{ transform: "translateY(-4px)" }}>(</span>;
      if (sub === '\\Big)') return <span key={"Bbr"+j} className="text-5xl inline-block align-middle mx-1 font-normal" style={{ transform: "translateY(-4px)" }}>)</span>;
      return <React.Fragment key={"sub"+j}>{renderInlineMath(sub, "m" + i + "s" + j)}</React.Fragment>;
    });

    return i % 2 === 1
      ? <bdi dir="ltr" className="math-ltr arabic-num" key={i}>{renderedSubParts}</bdi>
      : <React.Fragment key={i}>{renderedSubParts}</React.Fragment>;
  });
}

function LogScreen({ onBack }){
  const [log, setLog] = useState(() => {
    try {
      const raw = localStorage.getItem("quiz_attempts");
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr.slice().reverse() : [];
    } catch(e){ return []; }
  });
  const [msg, setMsg] = useState("");

  function flash(t){
    setMsg(t);
    setTimeout(() => setMsg(""), 2500);
  }

  function fmtDate(iso){
    try {
      const d = new Date(iso);
      return isNaN(d) ? "" : d.toLocaleString("ar-EG");
    } catch(e){ return ""; }
  }

  function downloadCSV(){
    if (!log.length) return;
    const header = "الاختبار,الاسم,النتيجة %,صحيحة,خاطئة,بدون إجابة,من,التاريخ";
    const rows = log.map(a => {
      return [a.quiz, a.name, a.score, a.correct, a.wrong, a.unanswered, a.total, fmtDate(a.date)]
        .map(v => '"' + String(v ?? "").replace(/"/g, '""') + '"').join(",");
    });
    const csv = "\ufeff" + header + "\n" + rows.join("\n");
    try {
      const blob = new Blob([csv], {type:"text/csv;charset=utf-8"});
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "quiz-results.csv";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      flash("تم تحميل ملف النتائج");
    } catch(e){}
  }

  function copyAll(){
    if (!log.length) return;
    const text = log.map(a => `${a.quiz} | ${a.name} | ${a.score}% (${a.correct}/${a.total}) | ${fmtDate(a.date)}`).join("\n");
    const done = () => flash("تم نسخ السجل");
    try {
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
      } else fallbackCopy(text, done);
    } catch(e){ fallbackCopy(text, done); }
  }

  function fallbackCopy(text, done){
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      done();
    } catch(e){}
  }

  function clearLog(){
    if (!log.length) return;
    if (!window.confirm("سيتم مسح كل النتائج المحفوظة على هذا الجهاز. هل أنت متأكد؟")) return;
    try { localStorage.removeItem("quiz_attempts"); } catch(e){}
    setLog([]);
    flash("تم مسح السجل");
  }

  return (
    <div className="max-w-3xl mx-auto fade-in">
      <FramedCard className="p-6 sm:p-8 mb-5">
        <div className="flex items-center justify-between gap-3 mb-1">
          <div>
            <h2 className="font-display font-black text-2xl" style={{color:"var(--ink)"}}>سجل النتائج</h2>
            <p className="text-xs font-bold" style={{color:"var(--slate)"}}>النتائج المحفوظة على هذا الجهاز — الأحدث أولًا</p>
          </div>
          <span className="font-display font-black text-sm px-3 py-1.5 rounded-full text-white arabic-num shrink-0" style={{background:"var(--teal-deep)"}}>
            {toArabicDigits(log.length)}
          </span>
        </div>

        {msg && <p className="text-center text-xs font-bold mt-3" style={{color:"var(--good)"}}>{msg}</p>}

        <div className="mt-5 space-y-3 max-h-[46vh] overflow-y-auto scrollbar-thin ps-1">
          {log.length === 0 && (
            <p className="text-center text-sm font-bold py-8" style={{color:"var(--slate)"}}>لا توجد نتائج محفوظة بعد.</p>
          )}
          {log.map((a, i) => (
            <div key={i} className="rounded-xl border border-[var(--line)] bg-white/70 px-4 py-3 flex items-center gap-3">
              <div className="w-10 h-10 rounded-full flex items-center justify-center font-display font-black text-lg text-white shrink-0" style={{background:"linear-gradient(135deg, var(--rose), var(--rose-deep))"}}>
                {String(a.name || "?").trim().charAt(0)}
              </div>
              <div className="min-w-0 flex-1">
                <p className="font-display font-black truncate" style={{color:"var(--ink)"}}>{a.name}</p>
                <p className="text-[11px] font-bold truncate" style={{color:"var(--slate)"}}>{a.quiz}</p>
                <p className="text-[11px] font-semibold arabic-num" style={{color:"var(--slate)"}}>
                  {toArabicDigits(a.correct)} صحيحة • {toArabicDigits(a.wrong)} خاطئة • {toArabicDigits(a.unanswered)} بدون إجابة • {fmtDate(a.date)}
                </p>
              </div>
              <div className="text-center shrink-0">
                <p className="font-display font-black text-2xl arabic-num" style={{color:"var(--teal-deep)"}}>{toArabicDigits(a.score)}<span className="text-sm">٪</span></p>
              </div>
            </div>
          ))}
        </div>
      </FramedCard>

      <div className="grid grid-cols-2 gap-3 mb-3">
        <button onClick={downloadCSV} disabled={!log.length} className="py-3 rounded-xl font-display font-bold text-white transition-all hover:-translate-y-0.5 disabled:opacity-40 disabled:cursor-not-allowed" style={{background:"linear-gradient(135deg, var(--teal), var(--teal-deep))"}}>
          تحميل CSV
        </button>
        <button onClick={copyAll} disabled={!log.length} className="py-3 rounded-xl font-display font-bold border-2 bg-white/70 transition-all disabled:opacity-40 disabled:cursor-not-allowed" style={{borderColor:"var(--teal-deep)", color:"var(--teal-deep)"}}>
          نسخ السجل
        </button>
      </div>
      <div className="grid grid-cols-2 gap-3">
        <button onClick={onBack} className="py-3 rounded-xl font-bold border border-[var(--line)] bg-white/70 hover:bg-white transition-all" style={{color:"var(--slate)"}}>
          رجوع
        </button>
        <button onClick={clearLog} disabled={!log.length} className="py-3 rounded-xl font-bold border-2 bg-white/70 transition-all disabled:opacity-40 disabled:cursor-not-allowed" style={{borderColor:"var(--bad)", color:"var(--bad)"}}>
          مسح السجل
        </button>
      </div>
    </div>
  );
}

}

function TimerRing({ secondsLeft, total }){
  const pct = Math.max(0, secondsLeft/total);
  const low = secondsLeft <= 60;
  const r = 26;
  const c = 2*Math.PI*r;
  return (
    <div className="relative w-16 h-16 shrink-0">
      <svg viewBox="0 0 64 64" className="w-16 h-16 -rotate-90">
        <circle cx="32" cy="32" r={r} fill="none" stroke="var(--paper-2)" strokeWidth="6"/>
        <circle cx="32" cy="32" r={r} fill="none"
          stroke={low ? "var(--bad)" : "var(--teal-deep)"} strokeWidth="6" strokeLinecap="round"
          strokeDasharray={c} strokeDashoffset={c*(1-pct)} className="tick"/>
      </svg>
      <div className="absolute inset-0 flex items-center justify-center">
        <span className={"text-[11px] font-bold arabic-num " + (low ? "text-[var(--bad)]" : "text-[var(--ink)]")}>
          {formatTime(secondsLeft)}
        </span>
      </div>
    </div>
  );
}

function QuizScreen({ name, onFinish }){
  const [index, setIndex] = useState(0);
  const [answers, setAnswers] = useState({});
  const [secondsLeft, setSecondsLeft] = useState(TOTAL_TIME);
  const timerRef = useRef(null);

  useEffect(() => {
    timerRef.current = setInterval(() => {
      setSecondsLeft(prev => {
        if (prev <= 1){
          clearInterval(timerRef.current);
          return 0;
        }
        return prev - 1;
      });
    }, 1000);
    return () => clearInterval(timerRef.current);
  }, []);

  useEffect(() => {
    if (secondsLeft === 0){
      onFinish(answers);
    }
  }, [secondsLeft]);

  const current = QUESTIONS[index];
  const selected = answers[index];
  const isCompare = current.layout === "compare";

  function selectOption(optIdx){
    setAnswers(prev => ({...prev, [index]: optIdx}));
  }

  function goNext(){
    if (index < QUESTIONS.length - 1){
      setIndex(index+1);
    } else {
      clearInterval(timerRef.current);
      onFinish(answers);
    }
  }

  function goPrev(){
    if (index > 0) setIndex(index-1);
  }

  const answeredCount = Object.keys(answers).length;

  return (
    <div className="max-w-3xl mx-auto">

      {/* Header */}
      <div className="flex items-center justify-between mb-5">
        <div>
          <p className="font-display font-bold text-lg" style={{color:"var(--ink)"}}>{QUIZ_SUBTITLE}</p>
          <p className="text-xs font-bold" style={{color:"var(--teal-deep)"}}>الطالب: {name}</p>
          <p className="text-xs font-bold text-[var(--slate)] arabic-num">
            تم الإجابة عن {toArabicDigits(answeredCount)} من {toArabicDigits(QUESTIONS.length)}
          </p>
        </div>
        <TimerRing secondsLeft={secondsLeft} total={TOTAL_TIME} />
      </div>

      <div className="mb-6">
        <ProgressBar current={index} total={QUESTIONS.length} />
      </div>

      {/* Question card */}
      <FramedCard key={index} className="fade-in p-6 sm:p-8 mb-5">
        <div className="flex items-start gap-3 mb-6">
          <span className="font-display font-black text-sm w-8 h-8 rounded-full flex items-center justify-center text-white shrink-0 arabic-num"
                style={{background:"linear-gradient(135deg, var(--rose), var(--rose-deep))"}}>
            {toArabicDigits(index+1)}
          </span>
          <p className="font-display font-black text-xl sm:text-2xl leading-loose whitespace-pre-line" style={{color:"var(--ink)"}}>
            {renderMathText(current.q)}
          </p>
        </div>

        <div className={"grid gap-3 " + (isCompare ? "grid-cols-1 sm:grid-cols-2" : "grid-cols-2 sm:grid-cols-4")}>
          {current.options.map((opt, i) => {
            const isSelected = selected === i;
            return (
              <button
                key={i}
                onClick={() => selectOption(i)}
                className={
                  "opt-btn flex items-center gap-2 w-full px-3 py-3.5 rounded-xl border-2 " +
                  (isCompare ? "justify-start text-right" : "justify-center text-center") + " " +
                  (isSelected ? "shadow-sm" : "border-[var(--line)] bg-white hover:border-[var(--teal)]")
                }
                style={isSelected ? { borderColor:"var(--teal-deep)", background:"var(--paper-2)" } : {}}
              >
                <span
                  className="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold shrink-0 border-2"
                  style={isSelected
                    ? { background:"var(--teal-deep)", color:"#fff", borderColor:"var(--teal-deep)" }
                    : { borderColor:"var(--line)", color:"var(--slate)" }}
                >
                  {["أ","ب","ج","د"][i]}
                </span>
                <span className="text-[17px] font-bold arabic-num" style={{color:"var(--ink)"}}>{renderMathText(opt)}</span>
              </button>
            );
          })}
        </div>
      </FramedCard>

      {/* Question map */}
      <div className="bg-white/60 border border-[var(--line)] rounded-2xl p-4 mb-5">
        <QuestionNav questions={QUESTIONS} answers={answers} currentIndex={index} onJump={setIndex} />
      </div>

      {/* Controls */}
      <div className="flex items-center justify-between gap-3">
        <button
          onClick={goPrev}
          disabled={index===0}
          className="px-5 py-3 rounded-xl font-bold border border-[var(--line)] bg-white/70 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-white transition-all"
          style={{color:"var(--slate)"}}
        >
          السابق
        </button>

        {index === QUESTIONS.length - 1 ? (
          <button
            onClick={() => onFinish(answers)}
            className="px-8 py-3 rounded-xl font-display font-bold text-white shadow-sm hover:-translate-y-0.5 transition-all"
            style={{background:"var(--good)"}}
          >

          <button
            onClick={goNext}
            className="px-8 py-3 rounded-xl font-display font-bold text-white shadow-sm hover:-translate-y-0.5 transition-all"
            style={{background:"linear-gradient(135deg, var(--teal), var(--teal-deep))"}}
          >

          </button>
        )}

    </div>
  );

        <div className="flex items-center justify-center gap-3 mb-2">
          <div className="w-12 h-12 rounded-full flex items-center justify-center font-display font-black text-xl text-white shrink-0" style={{background:"linear-gradient(135deg, var(--rose), var(--rose-deep))"}}>
            {name.trim().charAt(0)}
          </div>
          <div className="text-right">
            <p className="text-xs font-bold" style={{color:"var(--slate)"}}>نتيجة الطالب</p>
            <p className="font-display font-black text-2xl leading-tight" style={{color:"var(--ink)"}}>{name}</p>
          </div>
        </div>
        <p className="text-sm font-semibold text-[var(--slate)] mb-2">نتيجتك النهائية</p>
        <p className="font-display font-black text-6xl mb-2 arabic-num" style={{color:"var(--ink)"}}>
          {toArabicDigits(score)}<span className="text-2xl">٪</span>
        </p>
        <p className="font-display font-bold text-lg mb-8" style={{color:gradeColor}}>{grade}</p>

        <div className="grid grid-cols-3 gap-3">
          <div className="rounded-xl border border-[var(--line)] py-4">
            <p className="font-display font-black text-2xl arabic-num" style={{color:"var(--good)"}}>{toArabicDigits(correct)}</p>
            <p className="text-xs text-[var(--slate)] font-bold mt-1">إجابات صحيحة</p>
          </div>
          <div className="rounded-xl border border-[var(--line)] py-4">
            <p className="font-display font-black text-2xl arabic-num" style={{color:"var(--bad)"}}>{toArabicDigits(wrong)}</p>
            <p className="text-xs text-[var(--slate)] font-bold mt-1">إجابات خاطئة</p>
          </div>
          <div className="rounded-xl border border-[var(--line)] py-4">
            <p className="font-display font-black text-2xl text-[var(--slate)] arabic-num">{toArabicDigits(unanswered)}</p>
            <p className="text-xs text-[var(--slate)] font-bold mt-1">بدون إجابة</p>
          </div>
        </div>
      </FramedCard>

      <div className="flex gap-3 mb-6">
        <button
          onClick={() => setReviewOpen(v => !v)}
          className="flex-1 py-3.5 rounded-xl font-display font-bold border-2 bg-white/70 transition-all"
          style={{borderColor:"var(--teal-deep)", color:"var(--teal-deep)"}}
        >
          {reviewOpen ? "إخفاء المراجعة" : "مراجعة الإجابات"}
        </button>
        <button
          onClick={onRestart}
          className="flex-1 py-3.5 rounded-xl font-display font-bold text-white transition-all hover:-translate-y-0.5"
          style={{background:"linear-gradient(135deg, var(--teal), var(--teal-deep))"}}
        >
          إعادة الاختبار
        </button>
      </div>

      <button
        onClick={copyResult}
        className="w-full py-3 rounded-xl font-display font-bold border-2 bg-white/70 transition-all mb-3"
        style={{borderColor:"var(--brass-deep)", color:"var(--brass-deep)"}}
      >
        {copied ? "تم نسخ النتيجة ✓" : "نسخ النتيجة وإرسالها للمعلم"}
      </button>
      <button onClick={onNewStudent} className="w-full text-center text-xs font-bold underline underline-offset-2 mb-6" style={{color:"var(--slate)"}}>
        دخول باسم مختلف
      </button>

      {reviewOpen && (
        <div className="space-y-4">
          {QUESTIONS.map((q, i) => {
            const userAns = answers[i];
            const isCorrect = userAns === q.correctIndex;
            const wasAnswered = userAns !== undefined && userAns !== null;
            return (
              <div key={i} className="fade-in bg-white/80 border border-[var(--line)] rounded-xl p-5">
                <div className="flex items-start gap-3 mb-4">
                  <span
                    className="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold text-white shrink-0 arabic-num"
                    style={{background: !wasAnswered ? "var(--slate)" : isCorrect ? "var(--good)" : "var(--bad)"}}
                  >
                    {toArabicDigits(i+1)}
                  </span>
                  <p className="font-bold leading-relaxed whitespace-pre-line" style={{color:"var(--ink)"}}>
                    {renderMathText(q.q)}
                  </p>
                </div>
                <div className="grid gap-2">
                  {q.options.map((opt, oi) => {
                    const isRight = oi === q.correctIndex;
                    const isPicked = oi === userAns;
                    let style = { borderColor:"var(--line)" };
                    if (isRight) style = { borderColor:"var(--good)", background:"#eef7f2" };
                    else if (isPicked && !isRight) style = { borderColor:"var(--bad)", background:"#fbeeed" };
                    return (
                      <div key={oi} className="flex items-center gap-3 px-3.5 py-2.5 rounded-lg border" style={style}>
                        <span className="w-6 h-6 rounded-full flex items-center justify-center text-[11px] font-bold border shrink-0"
                              style={{borderColor:"var(--line)", color:"var(--slate)"}}>
                          {["أ","ب","ج","د"][oi]}
                        </span>
                        <span className="text-[15px] font-bold arabic-num" style={{color:"var(--ink)"}}>{renderMathText(opt)}</span>
                        {isRight && <span className="ms-auto text-xs font-bold" style={{color:"var(--good)"}}>الإجابة الصحيحة</span>}
                        {isPicked && !isRight && <span className="ms-auto text-xs font-bold" style={{color:"var(--bad)"}}>اخترتها</span>}
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function App(){
  const [stage, setStage] = useState("name");
  const [studentName, setStudentName] = useState("");
  const [finalAnswers, setFinalAnswers] = useState({});

  function handleNameSubmit(name){ setStudentName(name); setStage("start"); }
  function handleEditName(){ setStage("name"); }
  function handleStart(){ setStage("quiz"); }
  function handleFinish(answers){
    setFinalAnswers(answers);
    setStage("results");
  }
  function handleRestart(){
    setFinalAnswers({});
    setStage("start");
  }
  function handleNewStudent(){
    setFinalAnswers({});
    setStudentName("");
    setStage("name");
  }
  function handleOpenLog(){ setStage("log"); }
  function handleCloseLog(){ setStage(studentName ? "start" : "name"); }

  return (
    <AppShell>
      {stage === "name" && <NameScreen initialName={studentName} onSubmit={handleNameSubmit} onOpenLog={handleOpenLog} />}
      {stage === "start" && <StartScreen name={studentName} onStart={handleStart} onEditName={handleEditName} />}
      {stage === "quiz" && <QuizScreen name={studentName} onFinish={handleFinish} />}
      {stage === "results" && <ResultsScreen name={studentName} answers={finalAnswers} onRestart={handleRestart} onNewStudent={handleNewStudent} />}
      {stage === "log" && <LogScreen onBack={handleCloseLog} />}
    </AppShell>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

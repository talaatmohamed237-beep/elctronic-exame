<style>
  html { font-size: 98%; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  @media (max-width:640px) { html { font-size: 94%; } }
  :root{
    --ink:#12213b;        
    --paper:#f6f3ea;      
    --paper-2:#efe9d8;
    --brass:#b8863a;      
    --brass-deep:#8f6425;
    --slate:#3d5266;
    --good:#2f7d5b;
    --bad:#b0473e;
    --line:#e2d6c6;

    --rose:#e0577c;
    --rose-deep:#c23f63;
    --teal:#1f7a8c;
    --teal-deep:#155e6d;
    --shell-bg-1:#fbeee2;
    --shell-bg-2:#f7ede4;
    --shell-bg-3:#eef1f0;
  }
  *{ font-family:'IBM Plex Sans Arabic', 'Cairo', sans-serif; }
  .font-display{ font-family:'Cairo', sans-serif; }

  html, body{ height:100%; }
  body{
    background:
      radial-gradient(1100px 500px at 92% -8%, rgba(224,87,124,.16), transparent 60%),
      radial-gradient(900px 480px at -8% 108%, rgba(31,122,140,.14), transparent 60%),
      linear-gradient(155deg, var(--shell-bg-1) 0%, var(--shell-bg-2) 45%, var(--shell-bg-3) 100%);
    background-attachment: fixed;
  }

  .shell-blob{
    position:absolute;
    border-radius:9999px;
    filter: blur(60px);
    pointer-events:none;
  }

  .tick{
    transition: stroke-dashoffset 1s linear;
  }

  .opt-btn{
    transition: transform .15s ease, border-color .15s ease, background-color .15s ease;
  }
  .opt-btn:active{ transform: scale(0.98); }

  .fade-in{ animation: fadeIn .35s ease both; }
  @keyframes fadeIn{ from{ opacity:0; transform: translateY(6px);} to{ opacity:1; transform:translateY(0);} }

  .scrollbar-thin::-webkit-scrollbar{ width:6px; }
  .scrollbar-thin::-webkit-scrollbar-thumb{ background:var(--line); border-radius:99px; }

  .arabic-num{ font-feature-settings: "lnum"; }

  .math-ltr{
    unicode-bidi: isolate;
    direction: ltr;
    display: inline-block;
  }

  .corner-mark{
    position:absolute;
    width:1.75rem;
    height:1.75rem;
    pointer-events:none;
  }

  .frac-bar{
    line-height: 1.1;
  }
</style>

function formatElapsedTime(totalSeconds){
  const total=Math.max(0,Math.floor(Number(totalSeconds)||0)); const minutes=Math.floor(total/60); const seconds=total%60;
  const minuteUnit=minutes===1?"دقيقة":minutes===2?"دقيقتان":minutes>=3&&minutes<=10?"دقائق":"دقيقة";
  const secondUnit=seconds===1?"ثانية":seconds===2?"ثانيتان":seconds>=3&&seconds<=10?"ثوان":"ثانية";
  if(minutes===0)return toArabicDigits(seconds)+" "+secondUnit;
  return toArabicDigits(minutes)+" "+minuteUnit+(seconds?" و"+toArabicDigits(seconds)+" "+secondUnit:"");
}

function toArabicDigits(n){
  const map = ["٠","١","٢","٣","٤","٥","٦","٧","٨","٩"];
  return String(n).replace(/[0-9]/g, d => map[d]);
}

function formatTime(sec){
  const m = Math.floor(sec/60);
  const s = sec%60;
  return `${toArabicDigits(String(m).padStart(2,"0"))}:${toArabicDigits(String(s).padStart(2,"0"))}`;
}

function matchParen(s, prefix, needSep){
  // مطابقة الأوامر ذات الأقواس (\\F / \\R / \\P) مع دعم تداخل الأقواس
  const tag = "\\" + prefix + "(";
  let at = s.indexOf(tag);
  while (at !== -1){
    const open = at + tag.length - 1;
    let depth = 0, sep = -1;
    for (let j = open; j < s.length; j++){
      const ch = s[j];
      if (ch === "(") depth++;
      else if (ch === ")"){
        depth--;
        if (depth === 0){
          if (!needSep || sep !== -1){
            return { index: at, 0: s.slice(at, j + 1), 1: needSep ? s.slice(open + 1, sep) : s.slice(open + 1, j), 2: needSep ? s.slice(sep + 2, j) : "" };
          }
          break;
        }
      }
      else if (needSep && ch === ";" && s[j+1] === ";" && depth === 1 && sep === -1){ sep = j; }
    }
    at = s.indexOf(tag, at + 1);
  }
  return null;
}

function Power({ base, exp }){

    </span>
  );
}

function renderInlineMath(text, keyPrefix){
  if (typeof text !== "string") return text;
  const smallRe = /\\f\{([^{}]*?)\|\|([^{}]*?)\}/;
  // ملاحظة: مطابقة الأوامر ذات الأقواس (F/R/P) تتم عبر matchParen (تدعم التداخل)

  const nodes = [];
  let remaining = text;
  let key = 0;

  while (remaining.length){
    const bigMatch = matchParen(remaining, "F", true);
    const smallMatch = smallRe.exec(remaining);
    const rootMatch = matchParen(remaining, "R", false);
    const powMatch = matchParen(remaining, "P", true);

    let match = null;
    let type = "";
    let minIndex = remaining.length;

    if (bigMatch && bigMatch.index < minIndex) { match = bigMatch; type = "F"; minIndex = bigMatch.index; }
    if (smallMatch && smallMatch.index < minIndex) { match = smallMatch; type = "f"; minIndex = smallMatch.index; }
    if (rootMatch && rootMatch.index < minIndex) { match = rootMatch; type = "R"; minIndex = rootMatch.index; }
    if (powMatch && powMatch.index < minIndex) { match = powMatch; type = "P"; minIndex = powMatch.index; }

    if (!match){
      nodes.push(<React.Fragment key={keyPrefix + "-" + key++}>{remaining}</React.Fragment>);
      break;
    }
    if (match.index > 0){
      nodes.push(<React.Fragment key={keyPrefix + "-" + key++}>{remaining.slice(0, match.index)}</React.Fragment>);
    }

    if (type === "F"){
      nodes.push(
        <BigFraction
          key={keyPrefix + "-" + key++}
          num={renderInlineMath(match[1], keyPrefix + "-bn" + key)}
          den={renderInlineMath(match[2], keyPrefix + "-bd" + key)}
        />
      );
    } else if (type === "f"){
      // تم التحديث هنا عشان الكسر يقدر يقبل جذر جواه
      nodes.push(<Fraction key={keyPrefix + "-" + key++} num={renderInlineMath(match[1], keyPrefix + "-fn" + key)} den={renderInlineMath(match[2], keyPrefix + "-fd" + key)} />);
    } else if (type === "R"){
      nodes.push(
        <ArabicRoot key={keyPrefix + "-" + key++}>
          {renderInlineMath(match[1], keyPrefix + "-r" + key)}
        </ArabicRoot>
      );
    } else if (type === "P"){
      nodes.push(
        <Power
          key={keyPrefix + "-" + key++}
          base={renderInlineMath(match[1], keyPrefix + "-pb" + key)}
          exp={renderInlineMath(match[2], keyPrefix + "-pe" + key)}
        />
      );
    }
    remaining = remaining.slice(match.index + match[0].length);
  }
  return nodes;
}

function renderMathText(text){
  if (typeof text !== "string") return text;
  const parts = text.split("`");
  return parts.map((part, i) => {
    // دعم الأقواس الكبيرة جداً \Big والأقواس المتوسطة \big
    const subParts = part.split(/(\\big\(|\\big\)|\\Big\(|\\Big\))/g);
    
    const renderedSubParts = subParts.map((sub, j) => {
      if (sub === '\\big(') return <span key={"bl"+j} className="text-3xl inline-block align-middle mx-0.5 font-normal" style={{ transform: "translateY(-1px)" }}>(</span>;
      if (sub === '\\big)') return <span key={"br"+j} className="text-3xl inline-block align-middle mx-0.5 font-normal" style={{ transform: "translateY(-1px)" }}>)</span>;
      if (sub === '\\Big(') return <span key={"Bbl"+j} className="text-5xl inline-block align-middle mx-1 font-normal" style={{ transform: "translateY(-4px)" }}>(</span>;
      if (sub === '\\Big)') return <span key={"Bbr"+j} className="text-5xl inline-block align-middle mx-1 font-normal" style={{ transform: "translateY(-4px)" }}>)</span>;
      return <React.Fragment key={"sub"+j}>{renderInlineMath(sub, "m" + i + "s" + j)}</React.Fragment>;
    });

    return i % 2 === 1
      ? <bdi dir="ltr" className="math-ltr arabic-num" key={i}>{renderedSubParts}</bdi>
      : <React.Fragment key={i}>{renderedSubParts}</React.Fragment>;
  });
}

    timerRef.current = setInterval(() => {
      setSecondsLeft(prev => {
        if (prev <= 1){
          clearInterval(timerRef.current);
          return 0;
        }
        return prev - 1;
      });
    }, 1000);
    return () => clearInterval(timerRef.current);
  }, []);

    if (secondsLeft === 0){
      onFinish(answers);

        </div>
        <QuestionFigure q={current} />

        <div className={"grid gap-3 " + (isCompare ? "grid-cols-1 sm:grid-cols-2" : "grid-cols-2 sm:grid-cols-4")}>
          {current.options.map((opt, i) => {
            const isSelected = selected === i;
            return (
              <button
                key={i}
                onClick={() => selectOption(i)}
                className={
                  "opt-btn flex items-center gap-2 w-full px-3 py-3.5 rounded-xl border-2 " +
                  (isCompare ? "justify-start text-right" : "justify-center text-center") + " " +
                  (isSelected ? "shadow-sm" : "border-[var(--line)] bg-white hover:border-[var(--teal)]")
                }
                style={isSelected ? { borderColor:"var(--teal-deep)", background:"var(--paper-2)" } : {}}
              >
                <span
                  className="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold shrink-0 border-2"
                  style={isSelected
                    ? { background:"var(--teal-deep)", color:"#fff", borderColor:"var(--teal-deep)" }
                    : { borderColor:"var(--line)", color:"var(--slate)" }}
                >
                  {["أ","ب","ج","د"][i]}
                </span>
                <span className="text-[17px] font-bold arabic-num" style={{color:"var(--ink)"}}>{renderMathText(opt)}</span>
              </button>
            );
          })}
        </div>
      </FramedCard>

      {/* Question map */}
      <div className="bg-white/60 border border-[var(--line)] rounded-2xl p-4 mb-5">
        <QuestionNav questions={QUESTIONS} answers={answers} currentIndex={index} onJump={setIndex} />
      </div>

      {/* Controls */}
      <div className="flex items-center justify-between gap-3">
        <button
          onClick={goPrev}
          disabled={index===0}
          className="px-5 py-3 rounded-xl font-bold border border-[var(--line)] bg-white/70 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-white transition-all"
          style={{color:"var(--slate)"}}
        >
          السابق
        </button>

        {index === QUESTIONS.length - 1 ? (
          <button
            onClick={() => onFinish(answers)}
            className="px-8 py-3 rounded-xl font-display font-bold text-white shadow-sm hover:-translate-y-0.5 transition-all"
            style={{background:"var(--good)"}}
          >
            تسليم الاختبار
          </button>
        ) : (
          <button
            onClick={goNext}
            className="px-8 py-3 rounded-xl font-display font-bold text-white shadow-sm hover:-translate-y-0.5 transition-all"
            style={{background:"linear-gradient(135deg, var(--teal), var(--teal-deep))"}}
          >
            التالي
          </button>
        )}
      </div>
    </div>
  );
}

function ResultsScreen({ name, answers, elapsedSeconds, onRestart, onNewStudent }){
  const [reviewOpen, setReviewOpen] = useState(false);

  const { correct, wrong, unanswered, score } = useMemo(() => {
    let correct = 0, wrong = 0, unanswered = 0;
    QUESTIONS.forEach((q, i) => {
      if (answers[i] === undefined || answers[i] === null) unanswered++;
      else if (answers[i] === q.correctIndex) correct++;
      else wrong++;
    });
    const score = Math.round((correct / QUESTIONS.length) * 100);
    return { correct, wrong, unanswered, score };
  }, [answers]);

  const [copied, setCopied] = useState(false);


  function copyResult(){
    const d = new Date();
    const dateStr = d.toLocaleDateString("ar-EG") + " " + d.toLocaleTimeString("ar-EG", {hour:"2-digit", minute:"2-digit"});
    const text = QUIZ_KICKER + " | " + QUIZ_TITLE + " (" + QUIZ_SUBTITLE + ")\nالطالب: " + name + "\nالنتيجة: " + score + "% — " + correct + " إجابات صحيحة من " + QUESTIONS.length + "\nالتاريخ: " + dateStr;
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2500); };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
      } else fallbackCopy(text, done);
    } catch(e){ fallbackCopy(text, done); }
  }

  function fallbackCopy(text, done){
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      done();
    } catch(e){}
  }

  const grade = score >= 85 ? "ممتاز" : score >= 70 ? "جيد جدًا" : score >= 50 ? "جيد" : "يحتاج تدريبًا إضافيًا";
  const gradeColor = score >= 70 ? "var(--good)" : score >= 50 ? "var(--brass-deep)" : "var(--bad)";

  return (
    <div className="max-w-3xl mx-auto fade-in">

      <FramedCard className="p-8 sm:p-10 mb-6 text-center">
        <div className="flex items-center justify-center gap-3 mb-2">
          <div className="w-12 h-12 rounded-full flex items-center justify-center font-display font-black text-xl text-white shrink-0" style={{background:"linear-gradient(135deg, var(--rose), var(--rose-deep))"}}>
            {name.trim().charAt(0)}
          </div>
          <div className="text-right">
            <p className="text-xs font-bold" style={{color:"var(--slate)"}}>نتيجة الطالب</p>
            <p className="font-display font-black text-2xl leading-tight" style={{color:"var(--ink)"}}>{name}</p>
          </div>
        </div>
        <p className="text-sm font-semibold text-[var(--slate)] mb-2">نتيجتك النهائية</p>
        <p className="font-display font-black text-6xl mb-2 arabic-num" style={{color:"var(--ink)"}}>
          {toArabicDigits(score)}<span className="text-2xl">٪</span>
        </p>
        <p className="font-display font-bold text-lg mb-4" style={{color:gradeColor}}>{grade}</p>
        <div className="mx-auto mb-6 inline-flex items-center gap-2 rounded-full border px-4 py-2 text-sm sm:text-base font-bold shadow-sm" style={{borderColor:"var(--line)", background:"rgba(255,255,255,.82)", color:"var(--teal-deep)"}}>
          <span aria-hidden="true" className="inline-flex h-7 w-7 items-center justify-center rounded-full" style={{background:"var(--paper-2)"}}>⏱</span>
          <span>اجتزت الاختبار في <bdi dir="rtl">{formatElapsedTime(elapsedSeconds)}</bdi></span>
        </div>

        <div className="grid grid-cols-3 gap-3">
          <div className="rounded-xl border border-[var(--line)] py-4">
            <p className="font-display font-black text-2xl arabic-num" style={{color:"var(--good)"}}>{toArabicDigits(correct)}</p>
            <p className="text-xs text-[var(--slate)] font-bold mt-1">إجابات صحيحة</p>
          </div>
          <div className="rounded-xl border border-[var(--line)] py-4">
            <p className="font-display font-black text-2xl arabic-num" style={{color:"var(--bad)"}}>{toArabicDigits(wrong)}</p>
            <p className="text-xs text-[var(--slate)] font-bold mt-1">إجابات خاطئة</p>
          </div>
          <div className="rounded-xl border border-[var(--line)] py-4">
            <p className="font-display font-black text-2xl text-[var(--slate)] arabic-num">{toArabicDigits(unanswered)}</p>
            <p className="text-xs text-[var(--slate)] font-bold mt-1">بدون إجابة</p>
          </div>
        </div>
      </FramedCard>

      <div className="flex gap-3 mb-6">
        <button
          onClick={() => setReviewOpen(v => !v)}
          className="flex-1 py-3.5 rounded-xl font-display font-bold border-2 bg-white/70 transition-all"
          style={{borderColor:"var(--teal-deep)", color:"var(--teal-deep)"}}
        >
          {reviewOpen ? "إخفاء المراجعة" : "مراجعة الإجابات"}
        </button>
        <button
          onClick={onRestart}
          className="flex-1 py-3.5 rounded-xl font-display font-bold text-white transition-all hover:-translate-y-0.5"
          style={{background:"linear-gradient(135deg, var(--teal), var(--teal-deep))"}}
        >
          إعادة الاختبار
        </button>
      </div>

      <button
        onClick={copyResult}
        className="w-full py-3 rounded-xl font-display font-bold border-2 bg-white/70 transition-all mb-3"
        style={{borderColor:"var(--brass-deep)", color:"var(--brass-deep)"}}
      >
        {copied ? "تم نسخ النتيجة ✓" : "نسخ النتيجة وإرسالها للمعلم"}
      </button>
      <button onClick={onNewStudent} className="w-full text-center text-xs font-bold underline underline-offset-2 mb-6" style={{color:"var(--slate)"}}>
        دخول باسم مختلف
      </button>

      {reviewOpen && (
        <div className="space-y-4">
          {QUESTIONS.map((q, i) => {
            const userAns = answers[i];
            const isCorrect = userAns === q.correctIndex;
            const wasAnswered = userAns !== undefined && userAns !== null;
            return (
              <div key={i} className="fade-in bg-white/80 border border-[var(--line)] rounded-xl p-5">
                <div className="flex items-start gap-3 mb-4">
                  <span
                    className="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold text-white shrink-0 arabic-num"
                    style={{background: !wasAnswered ? "var(--slate)" : isCorrect ? "var(--good)" : "var(--bad)"}}
                  >
                    {toArabicDigits(i+1)}
                  </span>
                  <p className="font-bold leading-relaxed whitespace-pre-line" style={{color:"var(--ink)"}}>
                    {renderMathText(q.q)}
                  </p>
                </div>
                <QuestionFigure q={q} />
                <div className="grid gap-2">
                  {q.options.map((opt, oi) => {
                    const isRight = oi === q.correctIndex;
                    const isPicked = oi === userAns;
                    let style = { borderColor:"var(--line)" };
                    if (isRight) style = { borderColor:"var(--good)", background:"#eef7f2" };
                    else if (isPicked && !isRight) style = { borderColor:"var(--bad)", background:"#fbeeed" };
                    return (
                      <div key={oi} className="flex items-center gap-3 px-3.5 py-2.5 rounded-lg border" style={style}>
                        <span className="w-6 h-6 rounded-full flex items-center justify-center text-[11px] font-bold border shrink-0"
                              style={{borderColor:"var(--line)", color:"var(--slate)"}}>
                          {["أ","ب","ج","د"][oi]}
                        </span>
                        <span className="text-[15px] font-bold arabic-num" style={{color:"var(--ink)"}}>{renderMathText(opt)}</span>
                        {isRight && <span className="ms-auto text-xs font-bold" style={{color:"var(--good)"}}>الإجابة الصحيحة</span>}
                        {isPicked && !isRight && <span className="ms-auto text-xs font-bold" style={{color:"var(--bad)"}}>اخترتها</span>}
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function App(){
  const [stage, setStage] = useState("name");
  const [studentName, setStudentName] = useState("");
  const [finalAnswers, setFinalAnswers] = useState({});
  const [elapsedSeconds, setElapsedSeconds] = useState(0);
  const [saveState, setSaveState] = useState("idle");
  const submitted = useRef(false);
  const startedAt = useRef(0);
  const saveRequest = useRef(0);
  function handleNameSubmit(name){ setStudentName(name); setStage("start"); }
  function handleEditName(){ setStudentName(""); setStage("name"); }
  function handleStart(){ submitted.current=false; setElapsedSeconds(0); setSaveState("idle"); startedAt.current=Date.now(); setStage("quiz"); }
  function saveInBackground(answers){
    const requestId=++saveRequest.current;
    setSaveState("saving");
    Promise.resolve()
      .then(()=>window.QuizSync.submitAttempt({name:studentName, quiz:QUIZ_TITLE+" — "+QUIZ_SUBTITLE, questions:QUESTIONS, answers}))
      .then(()=>{if(saveRequest.current===requestId)setSaveState("saved");})
      .catch(err=>{console.error("تعذر حفظ المحاولة:",err);if(saveRequest.current===requestId)setSaveState("failed");});
  }
  function handleFinish(answers){
    if(submitted.current)return;
    submitted.current=true;
    const elapsed=Math.min(TOTAL_TIME,Math.max(0,Math.floor((Date.now()-(startedAt.current||Date.now()))/1000)));
    setElapsedSeconds(elapsed); setFinalAnswers(answers); setStage("results"); saveInBackground(answers);
  }
  function handleRestart(){submitted.current=false;setFinalAnswers({});setSaveState("idle");setStage("start");}
  function handleNewStudent(){submitted.current=false;setFinalAnswers({});setSaveState("idle");setStudentName("");setStage("name");}
  const saveMessage=saveState==="saving"?"ظهرت نتيجتك؛ جارٍ حفظ المحاولة في سجل المعلم...":saveState==="saved"?"تم حفظ المحاولة في سجل المعلم.":"ظهرت النتيجة، لكن تعذر تأكيد حفظها في سجل المعلم.";
  return (
    <AppShell>
      {stage==="name"&&<NameScreen initialName={studentName} onSubmit={handleNameSubmit}/>}
      {stage==="start"&&<StartScreen name={studentName} onStart={handleStart} onEditName={handleEditName}/>}
      {stage==="quiz"&&<QuizScreen name={studentName} onFinish={handleFinish}/>}
      {stage==="results"&&<ResultsScreen name={studentName} answers={finalAnswers} elapsedSeconds={elapsedSeconds} onRestart={handleRestart} onNewStudent={handleNewStudent}/>}
      {stage==="results"&&saveState!=="idle"&&<div role="status" aria-live="polite" className="fixed bottom-4 inset-x-4 z-50 mx-auto max-w-lg rounded-xl bg-white px-5 py-3 text-center text-sm font-bold shadow-xl" style={{color:saveState==="failed"?"var(--bad)":"var(--teal-deep)"}}>{saveMessage}</div>}
    </AppShell>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>اختبار القدرات الكمية</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#12213b;        
    --paper:#f6f3ea;      
    --paper-2:#efe9d8;
    --brass:#b8863a;      
    --brass-deep:#8f6425;
    --slate:#3d5266;
    --good:#2f7d5b;
    --bad:#b0473e;
    --line:#e2d6c6;

    --rose:#e0577c;
    --rose-deep:#c23f63;
    --teal:#1f7a8c;
    --teal-deep:#155e6d;
    --shell-bg-1:#fbeee2;
    --shell-bg-2:#f7ede4;
    --shell-bg-3:#eef1f0;
  }
  *{ font-family:'IBM Plex Sans Arabic', 'Cairo', sans-serif; }
  .font-display{ font-family:'Cairo', sans-serif; }

  html, body{ height:100%; }
  body{
    background:
      radial-gradient(1100px 500px at 92% -8%, rgba(224,87,124,.16), transparent 60%),
      radial-gradient(900px 480px at -8% 108%, rgba(31,122,140,.14), transparent 60%),
      linear-gradient(155deg, var(--shell-bg-1) 0%, var(--shell-bg-2) 45%, var(--shell-bg-3) 100%);
    background-attachment: fixed;
  }

  .shell-blob{
    position:absolute;
    border-radius:9999px;
    filter: blur(60px);
    pointer-events:none;
  }

  .tick{
    transition: stroke-dashoffset 1s linear;
  }

  .opt-btn{
    transition: transform .15s ease, border-color .15s ease, background-color .15s ease;
  }
  .opt-btn:active{ transform: scale(0.98); }

  .fade-in{ animation: fadeIn .35s ease both; }
  @keyframes fadeIn{ from{ opacity:0; transform: translateY(6px);} to{ opacity:1; transform:translateY(0);} }

  .scrollbar-thin::-webkit-scrollbar{ width:6px; }
  .scrollbar-thin::-webkit-scrollbar-thumb{ background:var(--line); border-radius:99px; }

  .arabic-num{ font-feature-settings: "lnum"; }

  .math-ltr{
    unicode-bidi: isolate;
    direction: ltr;
    display: inline-block;
  }

  .corner-mark{
    position:absolute;
    width:1.75rem;
    height:1.75rem;
    pointer-events:none;
  }

  .frac-bar{
    line-height: 1.1;
  }
</style>
</head>
<body class="min-h-screen">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

const QUESTIONS = [
  {
    q: "ما العدد الذي سدسه يساوي \\f{٢٥||٣} ؟",
    options: ["٣٠", "٤٠", "٥٠", "٦٠"],
    correctIndex: 2,
  },
  {
    q: "قارن بين:\nالقيمة الأولى: `\\f{٤||٥} × ١٠٠`\nالقيمة الثانية: `\\f{١||٣} × ٢٤٠`",
    options: ["القيمة الأولى أكبر", "القيمة الثانية أكبر", "القيمتان متساويتان", "المعطيات غير كافية"],
    correctIndex: 2,
    layout: "compare",
  },
  {
    q: "قارن بين:\nالقيمة الأولى: `\\f{١||٦} − \\f{١||١٢}`\nالقيمة الثانية: `\\f{١||١٢} − \\f{١||٦}`",
    options: ["القيمة الأولى أكبر", "القيمة الثانية أكبر", "القيمتان متساويتان", "المعطيات غير كافية"],
    correctIndex: 0,
    layout: "compare",
  },
  {
    q: "أوجد قيمة:\nنصف الثلث × ثلث الربع × ربع الخمس",
    options: ["`\\f{١||١٤٤٠}`", "`\\f{١||٧٢٠}`", "`\\f{١||٣٦٠}`", "`\\f{١||١٨٠}`"],
    correctIndex: 0,
  },
  {
    q: "تدرس هند ٣ ساعات يوميًا، ما الكسر الذي يمثل ما تدرسه هند في اليوم؟",
    options: ["`\\f{١||٦}`", "`\\f{١||٨}`", "`\\f{١||٤}`", "`\\f{١||٢}`"],
    correctIndex: 1,
  },
  {
    q: "قارن بين:\nالقيمة الأولى: ١٥\nالقيمة الثانية: `٩٠ × \\f{١||٦}`",
    options: ["القيمة الأولى أكبر", "القيمة الثانية أكبر", "القيمتان متساويتان", "المعطيات غير كافية"],
    correctIndex: 2,
    layout: "compare",
  },
  {
    q: "أحسب قيمة:\n`(\\f{٢ − ١||٢ + ١}) − (\\f{٢ + ١||٢ − ١})`",
    options: ["`− \\f{١٠||٣}`", "`− \\f{٨||٣}`", "`\\f{٨||٣}`", "`\\f{١٠||٣}`"],
    correctIndex: 1,
  },
  {
    q: "احسب قيمة:\n`\\f{٣||٢} + (\\f{٧||٤} × \\f{١||٧}) − (\\f{٥||٤} × \\f{٢||٥}) − \\f{٧||٤}`",
    options: ["١", "`\\f{١||٢}`", "`− \\f{١||٢}`", "`−٢`"],
    correctIndex: 2,
  },
  {
    q: "إذا كان `س = \\f{١٠٠||ص} = \\f{س||ص}`، أوجد قيمة ص",
    options: ["١", "١٠", "٥٠", "١٠٠"],
    correctIndex: 0,
  },
  {
    q: "إذا كان `\\F(\\f{٢||٣};;\\f{٥||٤}) = \\F(\\f{٨||١٥};;س)`، أوجد قيمة س؟",
    options: ["`\\f{١||٤}`", "`\\f{١||٢}`", "١", "٢"],
    correctIndex: 2,
  },
  {
    q: "إذا كان `س + \\f{١||س} = ٣ + \\f{١||٣}`، قارن بين:\nالقيمة الأولى: س\nالقيمة الثانية: ٢",
    options: ["القيمة الأولى أكبر", "القيمة الثانية أكبر", "القيمتان متساويتان", "المعطيات غير كافية"],
    correctIndex: 3,
    layout: "compare",
  },
  {
    q: "قارن بين:\nالقيمة الأولى: `\\f{١ + ٣||٥ + ٥}`\nالقيمة الثانية: `\\f{٣||٥} + \\f{٢||٥}`",
    options: ["القيمة الأولى أكبر", "القيمة الثانية أكبر", "القيمتان متساويتان", "المعطيات غير كافية"],
    correctIndex: 1,
    layout: "compare",
  },
  {
    q: "أحسب قيمة:\n`(\\f{٤||١٠} ÷ \\f{٣||٥}) − (\\f{٢||٨} + \\f{١||٤})`",
    options: ["٠", "١", "٢", "٣"],
    correctIndex: 0,
  },
  {
    q: "إذا كان `ص = \\f{١||٢} س ، ع = \\f{١||٢} ص`\nس + ص + ع = ٧ ، أوجد قيمة ع",
    options: ["١", "٣", "٥", "٧"],
    correctIndex: 0,
  },
  {
    q: "احسب قيمة:\n`\\f{١٤||١٤} × \\f{٧||٢} − ((١ − \\f{١||٢}) × ٢) − \\f{٧||٢}`",
    options: ["١", "−١", "٢", "−٢"],
    correctIndex: 1,
  },
  {
    q: "إذا كان `أ = \\f{١||ب} ، ب = \\f{١||ج} ، ج = \\f{١||د} ، د = جذر \\f{٦٤||٤٩}`\nأوجد قيمة (أ + ج) × د",
    options: ["`\\f{٣||٤}`", "٢", "`\\f{٧||٨}`", "٠"],
    correctIndex: 1,
  },
  {
    q: "خزان مملوء إلى خُمسه، فإذا أضفنا إليه ٥٦ لترًا، أصبح ممتلئًا، ما سعة الخزان؟",
    options: ["٦٠", "٦٥", "٧٠", "٧٥"],
    correctIndex: 2,
  },
  {
    q: "إذا كان `\\f{س||١٢} + \\f{ص||١٢} = \\f{٥||١٢}`، قارن بين:\nالقيمة الأولى: س + ص\nالقيمة الثانية: ٥",
    options: ["القيمة الأولى أكبر", "القيمة الثانية أكبر", "القيمتان متساويتان", "المعطيات غير كافية"],
    correctIndex: 2,
    layout: "compare",
  },
  {
    q: "إذا كان `م = \\f{٣١||٥٠} ، ن = \\f{٥٩||١٠٠} ، ل = \\f{٢٩٩||٥٠٠}`\nفأي الآتي ترتيبهم تصاعديًا؟",
    options: ["ن، ل، م", "ن، م، ل", "م، ن، ل", "م، ل، ن"],
    correctIndex: 0,
    layout: "compare",
  },
  {
    q: "قارن بين:\nالقيمة الأولى: `\\f{١||٢} − \\f{١||٢} ÷ \\f{١||٢}`\nالقيمة الثانية: ١",
    options: ["القيمة الأولى أكبر", "القيمة الثانية أكبر", "القيمتان متساويتان", "المعطيات غير كافية"],
    correctIndex: 1,
    layout: "compare",
  },
];

const QUIZ_TITLE = "اختبار ٢";
const QUIZ_KICKER = "اختبار القدرات الكمي";
const QUIZ_SUBTITLE = "الكسور والنسب — ٢٠ سؤالًا";
const SECONDS_PER_QUESTION = 60;
const TOTAL_TIME = QUESTIONS.length * SECONDS_PER_QUESTION;

function toArabicDigits(n){
  const map = ["٠","١","٢","٣","٤","٥","٦","٧","٨","٩"];
  return String(n).replace(/[0-9]/g, d => map[d]);
}

function formatTime(sec){
  const m = Math.floor(sec/60);
  const s = sec%60;
  return `${toArabicDigits(String(m).padStart(2,"0"))}:${toArabicDigits(String(s).padStart(2,"0"))}`;
}

function Fraction({ num, den }){
  return (
    <span className="inline-flex flex-col items-center mx-1 align-middle frac-bar font-bold" style={{verticalAlign:"middle"}}>
      <span dir="ltr" className="px-1 pb-[1px] text-[0.95em] border-b-[2px]" style={{borderColor:"currentColor"}}>{num}</span>
      <span dir="ltr" className="px-1 pt-[1px] text-[0.95em]">{den}</span>
    </span>
  );
}

function BigFraction({ num, den }){
  return (
    <span className="inline-flex flex-col items-center mx-1.5 align-middle frac-bar font-bold" style={{verticalAlign:"middle"}}>
      <span className="px-2 pb-1 border-b-[2px]" style={{borderColor:"currentColor"}}>{num}</span>
      <span className="px-2 pt-1">{den}</span>
    </span>
  );
}

function renderInlineMath(text, keyPrefix){
  if (typeof text !== "string") return text;
  const bigRe = /\\F\(([\s\S]*?);;([\s\S]*?)\)/;
  const smallRe = /\\f\{([^{}]*?)\|\|([^{}]*?)\}/;
  const nodes = [];
  let remaining = text;
  let key = 0;

  while (remaining.length){
    const bigMatch = bigRe.exec(remaining);
    const smallMatch = smallRe.exec(remaining);
    let match = null, isBig = false;
    if (bigMatch && (!smallMatch || bigMatch.index <= smallMatch.index)){ match = bigMatch; isBig = true; }
    else if (smallMatch){ match = smallMatch; isBig = false; }

    if (!match){
      nodes.push(<React.Fragment key={keyPrefix + "-" + key++}>{remaining}</React.Fragment>);
      break;
    }
    if (match.index > 0){
      nodes.push(<React.Fragment key={keyPrefix + "-" + key++}>{remaining.slice(0, match.index)}</React.Fragment>);
    }
    if (isBig){
      nodes.push(
        <BigFraction
          key={keyPrefix + "-" + key++}
          num={renderInlineMath(match[1], keyPrefix + "-bn" + key)}
          den={renderInlineMath(match[2], keyPrefix + "-bd" + key)}
        />
      );
    } else {
      nodes.push(<Fraction key={keyPrefix + "-" + key++} num={match[1]} den={match[2]} />);
    }
    remaining = remaining.slice(match.index + match[0].length);
  }
  return nodes;
}

function renderMathText(text){
  if (typeof text !== "string") return text;
  const parts = text.split("`");
  return parts.map((part, i) =>
    i % 2 === 1
      ? <bdi dir="ltr" className="math-ltr arabic-num" key={i}>{renderInlineMath(part, "m" + i)}</bdi>
      : <React.Fragment key={i}>{renderInlineMath(part, "p" + i)}</React.Fragment>
  );
}

function CornerMark({ position, color }){
  const styles = {
    tl: { top: "1.1rem", insetInlineStart: "1.1rem", borderTop:`3px solid ${color}`, borderInlineStart:`3px solid ${color}`, borderStartStartRadius:"10px" },
    tr: { top: "1.1rem", insetInlineEnd: "1.1rem", borderTop:`3px solid ${color}`, borderInlineEnd:`3px solid ${color}`, borderStartEndRadius:"10px" },
    bl: { bottom: "1.1rem", insetInlineStart: "1.1rem", borderBottom:`3px solid ${color}`, borderInlineStart:`3px solid ${color}`, borderEndStartRadius:"10px" },
    br: { bottom: "1.1rem", insetInlineEnd: "1.1rem", borderBottom:`3px solid ${color}`, borderInlineEnd:`3px solid ${color}`, borderEndEndRadius:"10px" },
  };
  return <div className="corner-mark" style={styles[position]}></div>;
}

function FramedCard({ className = "", children }){
  return (
    <div className={"relative bg-white/85 backdrop-blur border border-[var(--line)] rounded-[28px] shadow-[0_10px_40px_-12px_rgba(18,33,59,0.18)] " + className}>
      <CornerMark position="tl" color="var(--teal)" />
      <CornerMark position="tr" color="var(--rose)" />
      <CornerMark position="bl" color="var(--rose)" />
      <CornerMark position="br" color="var(--teal)" />
      {children}
    </div>
  );
}

function BrandLogoIcon({ size = 38 }){
  return (
    <div
      className="rounded-2xl flex items-center justify-center shrink-0 shadow-sm"
      style={{ width: size, height: size, background: "#ffffff", border: "1px solid var(--line)" }}
    >
      <svg width={size * 0.62} height={size * 0.62} viewBox="0 0 40 40" fill="none">
        <path d="M20 4 A16 16 0 0 1 36 20" stroke="var(--teal)" strokeWidth="5" strokeLinecap="round" />
        <path d="M20 36 A16 16 0 0 1 4 20" stroke="var(--rose)" strokeWidth="5" strokeLinecap="round" />
        <path d="M20 4 A16 16 0 0 0 4 20" stroke="var(--rose)" strokeWidth="5" strokeLinecap="round" opacity="0.3" />
        <path d="M20 36 A16 16 0 0 0 36 20" stroke="var(--teal)" strokeWidth="5" strokeLinecap="round" opacity="0.3" />
        <circle cx="20" cy="4" r="3.2" fill="var(--rose)" />
      </svg>
    </div>
  );
}

function BrandMark() {
  return (
    <div className="flex items-center gap-1.5 min-w-0">
      <BrandLogoIcon size={26} />

      <div className="leading-tight min-w-0">
        <p
          className="text-[5px] sm:text-[8px] font-semibold whitespace-nowrap"
          style={{ color: "var(--slate)" }}
        >
          منصة تدريب ذكية
        </p>

        <p
          className="font-display font-black text-[10px] sm:text-[20px] whitespace-nowrap"
          style={{ lineHeight: "1.1" }}
        >
          <span style={{ color: "var(--rose-deep)" }}>نيوتن</span>{" "}
          <span style={{ color: "var(--teal-deep)" }}>للقدرات</span>
        </p>
      </div>
    </div>
  );
}

function TopHeader(){
  return (
    <header className="px-4 sm:px-8 pt-5 sm:pt-7">
      <div className="max-w-4xl mx-auto grid grid-cols-3 items-center gap-2">
        <BrandMark />
        <div className="text-center">
          <p className="text-[11px] sm:text-xs font-bold" style={{color:"var(--rose-deep)"}}>{QUIZ_KICKER}</p>
          <p className="font-display font-black text-lg sm:text-2xl" style={{color:"var(--ink)"}}>{QUIZ_TITLE}</p>
        </div>
        <div className="justify-self-end">
          <span className="inline-flex items-center gap-1.5 ps-3 pe-3.5 py-1.5 rounded-full text-white text-[11px] sm:text-xs font-bold shadow-sm"
                style={{background:"var(--ink)"}}>
            <span className="w-1.5 h-1.5 rounded-full" style={{background:"var(--rose)"}}></span>
            قدرات كمي
          </span>
        </div>
      </div>
    </header>
  );
}

function IconButton({ children }){
  return (
    <div className="w-9 h-9 rounded-full flex items-center justify-center shrink-0 border transition-colors hover:bg-white"
         style={{borderColor:"var(--line)", color:"var(--teal-deep)", background:"rgba(255,255,255,.6)"}}>
      {children}
    </div>
  );
}

function FooterBar(){
  return (
    <footer className="px-4 sm:px-8 pb-6 pt-4 mt-auto">
      <div className="max-w-4xl mx-auto">
        <div className="rounded-2xl border shadow-sm px-4 sm:px-5 py-3 flex items-center justify-between gap-3 flex-wrap"
             style={{background:"rgba(255,255,255,.72)", backdropFilter:"blur(8px)", borderColor:"var(--line)"}}>

          <div className="flex items-center gap-3">
            <div className="w-10 h-10 rounded-full flex items-center justify-center shrink-0" style={{background:"var(--paper-2)", color:"var(--teal-deep)"}}>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M3 14v-2a9 9 0 0 1 18 0v2"/>
                <path d="M21 14a2 2 0 0 1-2 2h-1v-5h1a2 2 0 0 1 2 2z"/>
                <path d="M3 14a2 2 0 0 0 2 2h1v-5H5a2 2 0 0 0-2 2z"/>
              </svg>
            </div>
            <div className="leading-tight">
              <p className="text-xs font-bold" style={{color:"var(--ink)"}}>دعمك يهمنا</p>
              <p className="text-[11px]" style={{color:"var(--slate)"}}>نحن هنا لمساعدتك</p>
            </div>
          </div>

          <IconButton>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 14 0v1"/>
            </svg>
          </IconButton>

          <div className="flex items-center gap-2.5">
            <span className="text-xs font-bold hidden sm:inline" style={{color:"var(--slate)"}}>تابعونا</span>
            <div className="flex items-center gap-2">
              <IconButton>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M21 11.5a8.5 8.5 0 0 1-12.4 7.6L3 20l1-5.4A8.5 8.5 0 1 1 21 11.5z"/>
                </svg>
              </IconButton>
              <IconButton>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="3.5"/><circle cx="17.2" cy="6.8" r="0.6" fill="currentColor" stroke="none"/>
                </svg>
              </IconButton>
              <IconButton>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <polygon points="6 3 20 12 6 21 6 3"/>
                </svg>
              </IconButton>
              <IconButton>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M20 6.5a3.5 3.5 0 0 0-3.5-3.5c-1.4 0-2.6.8-3.2 2A3.9 3.9 0 0 0 9.5 3 3.5 3.5 0 0 0 6 6.5c0 5 6.5 9 6.5 9s7.5-4 7.5-9z"/>
                </svg>
              </IconButton>
            </div>
          </div>
        </div>
      </div>
    </footer>
  );
}

function AppShell({ children }){
  return (
    <div className="min-h-screen relative overflow-hidden flex flex-col">
      <div className="shell-blob w-80 h-80 sm:w-96 sm:h-96" style={{top:"-6rem", insetInlineEnd:"-6rem", background:"rgba(224,87,124,.28)"}}></div>
      <div className="shell-blob w-80 h-80 sm:w-[26rem] sm:h-[26rem]" style={{bottom:"-8rem", insetInlineStart:"-6rem", background:"rgba(31,122,140,.22)"}}></div>
      <div className="relative z-10 flex flex-col min-h-screen">
        <TopHeader />
        <main className="flex-1 px-4 sm:px-8 py-6 sm:py-8">
          {children}
        </main>
        <FooterBar />
      </div>
    </div>
  );
}

function StartScreen({ onStart }){
  return (
    <div className="flex items-start sm:items-center justify-center">
      <div className="max-w-xl w-full fade-in">
        <FramedCard className="p-8 sm:p-10">
          <h1 className="font-display font-black text-3xl sm:text-4xl leading-tight mb-2" style={{color:"var(--ink)"}}>
            {QUIZ_KICKER}
          </h1>
          <p className="text-[var(--slate)] mb-8 font-bold">{QUIZ_SUBTITLE}</p>

          <div className="grid grid-cols-3 gap-3 mb-8">
            <div className="rounded-xl border border-[var(--line)] py-4 text-center">
              <p className="font-display font-black text-2xl arabic-num" style={{color:"var(--rose-deep)"}}>{toArabicDigits(QUESTIONS.length)}</p>
              <p className="text-xs text-[var(--slate)] font-bold mt-1">سؤال</p>
            </div>
            <div className="rounded-xl border border-[var(--line)] py-4 text-center">
              <p className="font-display font-black text-2xl arabic-num" style={{color:"var(--rose-deep)"}}>{toArabicDigits(QUESTIONS.length)}</p>
              <p className="text-xs text-[var(--slate)] font-bold mt-1">دقيقة</p>
            </div>
            <div className="rounded-xl border border-[var(--line)] py-4 text-center">
              <p className="font-display font-black text-2xl arabic-num" style={{color:"var(--rose-deep)"}}>{toArabicDigits(4)}</p>
              <p className="text-xs text-[var(--slate)] font-bold mt-1">خيارات لكل سؤال</p>
            </div>
          </div>

          <ul className="space-y-2 mb-9 text-sm text-[var(--slate)] font-semibold">
            <li className="flex gap-2"><span style={{color:"var(--teal-deep)"}}>—</span> يمكنك التنقل بين الأسئلة والعودة لمراجعتها قبل التسليم.</li>
            <li className="flex gap-2"><span style={{color:"var(--teal-deep)"}}>—</span> ينتهي الاختبار تلقائيًا عند انتهاء الوقت المحدد.</li>
            <li className="flex gap-2"><span style={{color:"var(--teal-deep)"}}>—</span> ستحصل على مراجعة كاملة للإجابات في نهاية الاختبار.</li>
          </ul>

          <button
            onClick={onStart}
            className="w-full py-4 rounded-xl font-display font-bold text-white text-lg shadow-sm hover:shadow-md transition-all hover:-translate-y-0.5"
            style={{background:"linear-gradient(135deg, var(--teal), var(--teal-deep))"}}
          >
            ابدأ الاختبار
          </button>
        </FramedCard>
      </div>
    </div>
  );
}

function ProgressBar({ current, total }){
  const pct = ((current+1)/total)*100;
  return (
    <div className="w-full h-2 rounded-full bg-[var(--paper-2)] overflow-hidden border border-[var(--line)]">
      <div className="h-full rounded-full transition-all duration-500" style={{width:`${pct}%`, background:"linear-gradient(90deg, var(--rose), var(--brass))"}}></div>
    </div>
  );
}

function TimerRing({ secondsLeft, total }){
  const pct = Math.max(0, secondsLeft/total);
  const low = secondsLeft <= 60;
  const r = 26;
  const c = 2*Math.PI*r;
  return (
    <div className="relative w-16 h-16 shrink-0">
      <svg viewBox="0 0 64 64" className="w-16 h-16 -rotate-90">
        <circle cx="32" cy="32" r={r} fill="none" stroke="var(--paper-2)" strokeWidth="6"/>
        <circle cx="32" cy="32" r={r} fill="none"
          stroke={low ? "var(--bad)" : "var(--teal-deep)"} strokeWidth="6" strokeLinecap="round"
          strokeDasharray={c} strokeDashoffset={c*(1-pct)} className="tick"/>
      </svg>
      <div className="absolute inset-0 flex items-center justify-center">
        <span className={"text-[11px] font-bold arabic-num " + (low ? "text-[var(--bad)]" : "text-[var(--ink)]")}>
          {formatTime(secondsLeft)}
        </span>
      </div>
    </div>
  );
}

function QuestionNav({ questions, answers, currentIndex, onJump }){
  return (
    <div className="grid grid-cols-10 sm:grid-cols-10 gap-2 max-h-40 overflow-y-auto scrollbar-thin pe-1">
      {questions.map((_, i) => {
        const answered = answers[i] !== undefined && answers[i] !== null;
        const isCurrent = i === currentIndex;
        return (
          <button
            key={i}
            onClick={() => onJump(i)}
            className={
              "aspect-square rounded-lg text-xs font-bold flex items-center justify-center border transition-all arabic-num " +
              (isCurrent
                ? "text-white border-transparent"
                : answered
                  ? "border-transparent"
                  : "border-[var(--line)] text-[var(--slate)] bg-white/60")
            }
            style={
              isCurrent
                ? { background:"var(--teal-deep)" }
                : answered
                  ? { background:"var(--paper-2)", color:"var(--rose-deep)" }
                  : {}
            }
          >
            {toArabicDigits(i+1)}
          </button>
        );
      })}
    </div>
  );
}

function QuizScreen({ onFinish }){
  const [index, setIndex] = useState(0);
  const [answers, setAnswers] = useState({});
  const [secondsLeft, setSecondsLeft] = useState(TOTAL_TIME);
  const timerRef = useRef(null);

  useEffect(() => {
    timerRef.current = setInterval(() => {
      setSecondsLeft(prev => {
        if (prev <= 1){
          clearInterval(timerRef.current);
          return 0;
        }
        return prev - 1;
      });
    }, 1000);
    return () => clearInterval(timerRef.current);
  }, []);

  useEffect(() => {
    if (secondsLeft === 0){
      onFinish(answers);
    }
  }, [secondsLeft]);

  const current = QUESTIONS[index];
  const selected = answers[index];
  const isCompare = current.layout === "compare";

  function selectOption(optIdx){
    setAnswers(prev => ({...prev, [index]: optIdx}));
  }

  function goNext(){
    if (index < QUESTIONS.length - 1){
      setIndex(index+1);
    } else {
      clearInterval(timerRef.current);
      onFinish(answers);
    }
  }

  function goPrev(){
    if (index > 0) setIndex(index-1);
  }

  const answeredCount = Object.keys(answers).length;

  return (
    <div className="max-w-3xl mx-auto">

      {/* Header */}
      <div className="flex items-center justify-between mb-5">
        <div>
          <p className="font-display font-bold text-lg" style={{color:"var(--ink)"}}>{QUIZ_SUBTITLE}</p>
          <p className="text-xs font-bold text-[var(--slate)] arabic-num">
            تم الإجابة عن {toArabicDigits(answeredCount)} من {toArabicDigits(QUESTIONS.length)}
          </p>
        </div>
        <TimerRing secondsLeft={secondsLeft} total={TOTAL_TIME} />
      </div>

      <div className="mb-6">
        <ProgressBar current={index} total={QUESTIONS.length} />
      </div>

      {/* Question card */}
      <FramedCard key={index} className="fade-in p-6 sm:p-8 mb-5">
        <div className="flex items-start gap-3 mb-6">
          <span className="font-display font-black text-sm w-8 h-8 rounded-full flex items-center justify-center text-white shrink-0 arabic-num"
                style={{background:"linear-gradient(135deg, var(--rose), var(--rose-deep))"}}>
            {toArabicDigits(index+1)}
          </span>
          <p className="font-display font-black text-xl sm:text-2xl leading-loose whitespace-pre-line" style={{color:"var(--ink)"}}>
            {renderMathText(current.q)}
          </p>
        </div>

        <div className={"grid gap-3 " + (isCompare ? "grid-cols-1 sm:grid-cols-2" : "grid-cols-2 sm:grid-cols-4")}>
          {current.options.map((opt, i) => {
            const isSelected = selected === i;
            return (
              <button
                key={i}
                onClick={() => selectOption(i)}
                className={
                  "opt-btn flex items-center gap-2 w-full px-3 py-3.5 rounded-xl border-2 " +
                  (isCompare ? "justify-start text-right" : "justify-center text-center") + " " +
                  (isSelected ? "shadow-sm" : "border-[var(--line)] bg-white hover:border-[var(--teal)]")
                }
                style={isSelected ? { borderColor:"var(--teal-deep)", background:"var(--paper-2)" } : {}}
              >
                <span
                  className="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold shrink-0 border-2"
                  style={isSelected
                    ? { background:"var(--teal-deep)", color:"#fff", borderColor:"var(--teal-deep)" }
                    : { borderColor:"var(--line)", color:"var(--slate)" }}
                >
                  {["أ","ب","ج","د"][i]}
                </span>
                <span className="text-[17px] font-bold arabic-num" style={{color:"var(--ink)"}}>{renderMathText(opt)}</span>
              </button>
            );
          })}
        </div>
      </FramedCard>

      {/* Question map */}
      <div className="bg-white/60 border border-[var(--line)] rounded-2xl p-4 mb-5">
        <QuestionNav questions={QUESTIONS} answers={answers} currentIndex={index} onJump={setIndex} />
      </div>

      {/* Controls */}
      <div className="flex items-center justify-between gap-3">
        <button
          onClick={goPrev}
          disabled={index===0}
          className="px-5 py-3 rounded-xl font-bold border border-[var(--line)] bg-white/70 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-white transition-all"
          style={{color:"var(--slate)"}}
        >
          السابق
        </button>

        {index === QUESTIONS.length - 1 ? (
          <button
            onClick={() => onFinish(answers)}
            className="px-8 py-3 rounded-xl font-display font-bold text-white shadow-sm hover:-translate-y-0.5 transition-all"
            style={{background:"var(--good)"}}
          >
            تسليم الاختبار
          </button>
        ) : (
          <button
            onClick={goNext}
            className="px-8 py-3 rounded-xl font-display font-bold text-white shadow-sm hover:-translate-y-0.5 transition-all"
            style={{background:"linear-gradient(135deg, var(--teal), var(--teal-deep))"}}
          >
            التالي
          </button>
        )}
      </div>
    </div>
  );
}

function ResultsScreen({ answers, onRestart }){
  const [reviewOpen, setReviewOpen] = useState(false);

  const { correct, wrong, unanswered, score } = useMemo(() => {
    let correct = 0, wrong = 0, unanswered = 0;
    QUESTIONS.forEach((q, i) => {
      if (answers[i] === undefined || answers[i] === null) unanswered++;
      else if (answers[i] === q.correctIndex) correct++;
      else wrong++;
    });
    const score = Math.round((correct / QUESTIONS.length) * 100);
    return { correct, wrong, unanswered, score };
  }, [answers]);

  const grade = score >= 85 ? "ممتاز" : score >= 70 ? "جيد جدًا" : score >= 50 ? "جيد" : "يحتاج تدريبًا إضافيًا";
  const gradeColor = score >= 70 ? "var(--good)" : score >= 50 ? "var(--brass-deep)" : "var(--bad)";

  return (
    <div className="max-w-3xl mx-auto fade-in">

      <FramedCard className="p-8 sm:p-10 mb-6 text-center">
        <p className="text-sm font-semibold text-[var(--slate)] mb-2">نتيجتك النهائية</p>
        <p className="font-display font-black text-6xl mb-2 arabic-num" style={{color:"var(--ink)"}}>
          {toArabicDigits(score)}<span className="text-2xl">٪</span>
        </p>
        <p className="font-display font-bold text-lg mb-8" style={{color:gradeColor}}>{grade}</p>

        <div className="grid grid-cols-3 gap-3">
          <div className="rounded-xl border border-[var(--line)] py-4">
            <p className="font-display font-black text-2xl arabic-num" style={{color:"var(--good)"}}>{toArabicDigits(correct)}</p>
            <p className="text-xs text-[var(--slate)] font-bold mt-1">إجابات صحيحة</p>
          </div>
          <div className="rounded-xl border border-[var(--line)] py-4">
            <p className="font-display font-black text-2xl arabic-num" style={{color:"var(--bad)"}}>{toArabicDigits(wrong)}</p>
            <p className="text-xs text-[var(--slate)] font-bold mt-1">إجابات خاطئة</p>
          </div>
          <div className="rounded-xl border border-[var(--line)] py-4">
            <p className="font-display font-black text-2xl text-[var(--slate)] arabic-num">{toArabicDigits(unanswered)}</p>
            <p className="text-xs text-[var(--slate)] font-bold mt-1">بدون إجابة</p>
          </div>
        </div>
      </FramedCard>

      <div className="flex gap-3 mb-6">
        <button
          onClick={() => setReviewOpen(v => !v)}
          className="flex-1 py-3.5 rounded-xl font-display font-bold border-2 bg-white/70 transition-all"
          style={{borderColor:"var(--teal-deep)", color:"var(--teal-deep)"}}
        >
          {reviewOpen ? "إخفاء المراجعة" : "مراجعة الإجابات"}
        </button>
        <button
          onClick={onRestart}
          className="flex-1 py-3.5 rounded-xl font-display font-bold text-white transition-all hover:-translate-y-0.5"
          style={{background:"linear-gradient(135deg, var(--teal), var(--teal-deep))"}}
        >
          إعادة الاختبار
        </button>
      </div>

      {reviewOpen && (
        <div className="space-y-4">
          {QUESTIONS.map((q, i) => {
            const userAns = answers[i];
            const isCorrect = userAns === q.correctIndex;
            const wasAnswered = userAns !== undefined && userAns !== null;
            return (
              <div key={i} className="fade-in bg-white/80 border border-[var(--line)] rounded-xl p-5">
                <div className="flex items-start gap-3 mb-4">
                  <span
                    className="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold text-white shrink-0 arabic-num"
                    style={{background: !wasAnswered ? "var(--slate)" : isCorrect ? "var(--good)" : "var(--bad)"}}
                  >
                    {toArabicDigits(i+1)}
                  </span>
                  <p className="font-bold leading-relaxed whitespace-pre-line" style={{color:"var(--ink)"}}>
                    {renderMathText(q.q)}
                  </p>
                </div>
                <div className="grid gap-2">
                  {q.options.map((opt, oi) => {
                    const isRight = oi === q.correctIndex;
                    const isPicked = oi === userAns;
                    let style = { borderColor:"var(--line)" };
                    if (isRight) style = { borderColor:"var(--good)", background:"#eef7f2" };
                    else if (isPicked && !isRight) style = { borderColor:"var(--bad)", background:"#fbeeed" };
                    return (
                      <div key={oi} className="flex items-center gap-3 px-3.5 py-2.5 rounded-lg border" style={style}>
                        <span className="w-6 h-6 rounded-full flex items-center justify-center text-[11px] font-bold border shrink-0"
                              style={{borderColor:"var(--line)", color:"var(--slate)"}}>
                          {["أ","ب","ج","د"][oi]}
                        </span>
                        <span className="text-[15px] font-bold arabic-num" style={{color:"var(--ink)"}}>{renderMathText(opt)}</span>
                        {isRight && <span className="ms-auto text-xs font-bold" style={{color:"var(--good)"}}>الإجابة الصحيحة</span>}
                        {isPicked && !isRight && <span className="ms-auto text-xs font-bold" style={{color:"var(--bad)"}}>اخترتها</span>}
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function App(){
  const [stage, setStage] = useState("start");
  const [finalAnswers, setFinalAnswers] = useState({});

  function handleStart(){ setStage("quiz"); }
  function handleFinish(answers){
    setFinalAnswers(answers);
    setStage("results");
  }
  function handleRestart(){
    setFinalAnswers({});
    setStage("start");
  }

  return (
    <AppShell>
      {stage === "start" && <StartScreen onStart={handleStart} />}
      {stage === "quiz" && <QuizScreen onFinish={handleFinish} />}
      {stage === "results" && <ResultsScreen answers={finalAnswers} onRestart={handleRestart} />}
    </AppShell>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
